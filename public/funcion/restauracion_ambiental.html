<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Un Grano de Mostaza - Restauración Ambiental</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ABeeZee&family=ADLaM+Display&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'ABeeZee', sans-serif;
            background-color: #fff9e6;
            color: #676000;
            margin: 40px;
        }
        .header-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 18px;
            margin-bottom: 15px;
        }
        h2 { font-family: 'ADLaM Display', cursive; text-align: center; color: #504a05; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #333; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button {
            font-family: 'ABeeZee', sans-serif;
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #b2ef61;
            color: #6a6200;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background-color: #f0e01e; }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://www.iies.unam.mx/laboratorios/restauracion-ambiental/wp-content/uploads/2018/09/green-beautiful-mexico-nature-serene-jungle-waterfall-best-hd-wallpaper-luxury-hd-wallpaper-beautiful-natural-waterfall-of-green-beautiful-mexico-nature-serene-jungle-waterfall-best-hd-wallp.jpg" alt="Restauración Ambiental" class="header-img">
        <h2>Registro de Proyecto Ambiental</h2>

        <!-- ENLACE AL PHP MEDIANTE ACTION Y METHOD GET -->
        <form action="procesar_restauracion.php" method="GET">
            <label for="nombre_proyecto">1. Nombre del Proyecto:</label>
            <input type="text" id="nombre_proyecto" name="nombre_proyecto" required>

            <label for="tipo_ecosistema">2. Tipo de Ecosistema:</label>
            <select id="tipo_ecosistema" name="tipo_ecosistema">
                <option value="Bosque">Bosque</option>
                <option value="Río / Cuenca">Río / Cuenca</option>
                <option value="Urbano / Parque">Urbano / Parque</option>
                <option value="Zona Agrícola">Zona Agrícola</option>
            </select>

            <label for="ubicacion">3. Ubicación / Zona:</label>
            <input type="text" id="ubicacion" name="ubicacion" required>

            <label for="arboles_meta">4. Meta de Árboles / Plantas:</label>
            <input type="number" id="arboles_meta" name="arboles_meta" min="1" required>

            <label for="fecha_inicio">5. Fecha de Inicio Estimada:</label>
            <input type="date" id="fecha_inicio" name="fecha_inicio" required>

            <button type="submit">Enviar Datos</button>
        </form>
    </div>
</body>
</html>

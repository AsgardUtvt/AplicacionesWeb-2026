services:
  web:
    build: ./docker/php
    container_name: mi_apache_php
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html
      - ./docker/vhost.conf:/etc/apache2/sites-available/000-default.conf
    depends_on:
      - db
    environment:                    # opcional pero recomendado
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=asgard
      - DB_PASS=admin
      - DB_NAME=un_grano_de_mostaza

  db:
    image: mariadb:lts-ubi10
    container_name: mi_maria_db
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASS}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}          # ← corregido (sin espacio)
      MARIADB_PASSWORD: ${MYSQL_PASS}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  composer:
    image: composer:latest
    user: "1000:1000"
    volumes:
      - ./public:/app
    working_dir: /app
    entrypoint: [ "composer" ]

volumes:
  db_data:
